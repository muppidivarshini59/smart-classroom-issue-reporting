<!DOCTYPE html>
<html>
<head>
    <title>Smart Classroom Issue Reporting</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            background: white;
            width: 90%;
            max-width: 450px;
            padding: 35px 25px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.12);
        }

        h1 {
            font-size: 25px;
            margin-bottom: 10px;
        }

        p {
            color: #666;
            margin-bottom: 30px;
        }

        .button {
            display: block;
            text-decoration: none;
            color: white;
            padding: 15px;
            margin: 15px 0;
            border-radius: 8px;
            font-size: 17px;
            font-weight: bold;
        }

        .student {
            background: #2563eb;
        }

        .admin {
            background: #374151;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Smart Classroom Issue Reporting</h1>

    <p>Select an option to continue</p>

    <a href="{{ url_for('report_form') }}" class="button student">
        Student Report Issue
    </a>

    <a href="{{ url_for('admin_login') }}" class="button admin">
        Admin Login
    </a>

</div>

</body>
</html>
